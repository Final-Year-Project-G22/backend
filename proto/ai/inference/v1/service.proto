syntax = "proto3";

package ai.inference.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/Final-Year-Project-G22/backend/core-backend/pb";

service AIInferenceService {
  rpc Ask(AskRequest) returns (AskResponse);
  rpc AskStream(AskRequest) returns (stream AskStreamChunk);
}

message AskRequest {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  string account_id = 3 [(buf.validate.field).string.uuid = true];
  string query = 4 [(buf.validate.field).string.min_len = 1];
  string language = 5;
  optional string session_id = 6 [(buf.validate.field).string.uuid = true];
  int32 top_k = 7 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
  optional string title = 8;
}

message Citation {
  string document_id = 1 [(buf.validate.field).string.uuid = true];
  string chunk_id = 2 [(buf.validate.field).string.uuid = true];
  string source_type = 3;
  optional string title = 4;
  double score = 5;
}

message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

message AskResponse {
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  string session_id = 2 [(buf.validate.field).string.uuid = true];
  string answer = 3;
  repeated Citation citations = 4;
  Usage usage = 5;
  string model = 6;
  int32 latency_ms = 7;
}

message AskStreamChunk {
  oneof chunk {
    TextChunk text = 1;
    CitationsChunk citations = 2;
    DoneChunk done = 3;
    ErrorChunk error = 4;
  }
}

message TextChunk {
  string text = 1;
}

message CitationsChunk {
  repeated Citation citations = 1;
}

message DoneChunk {
  int32 latency_ms = 1;
  string model = 2;
  Usage usage = 3;
}

message ErrorChunk {
  string code = 1;
  string message = 2;
}