app:
  environment: "development"
  debug: true

ai:
  conversation_cache_ttl: 5m

ingestion:
  enabled: true
  dispatcher:
    batch_size: 50
    interval: 5s
    retry_base_delay: 30s
    retry_max_delay: 10m
    max_attempts_before_dlq: 10

logger:
  level: "debug"
  encoding: "console"
  output_paths: ["stdout"]
  error_output_paths: ["stderr"]

cache:
  enabled: false

jwt:
  access_token_ttl: 30m
  refresh_token_ttl: 336h
