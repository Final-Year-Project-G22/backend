app:
  name: "server"
  environment: "local"
  version: "0.1.0"
  port: 4000
  grpc_port: 50052
  debug: true

ai:
  inference_grpc_endpoint: ${AI_INFERENCE_GRPC_ENDPOINT:-localhost:50051}
  inference_auth_token: ${AI_INFERENCE_AUTH_TOKEN:-}
  inference_timeout: 60s
  ask_enabled: true
  conversation_cache_ttl: 5m

ingestion:
  enabled: true
  signing:
    active_key_id: ${INGESTION_SIGNING_ACTIVE_KEY_ID:-ingestion-v1}
    active_key_secret: ${INGESTION_SIGNING_ACTIVE_KEY_SECRET:-change-me}
    previous_keys: []
  dispatcher:
    batch_size: 50
    interval: 5s
    retry_base_delay: 30s
    retry_max_delay: 10m
    max_attempts_before_dlq: 10

database:
  type: "postgres"
  host: "localhost"
  port: 5432
  sslmode: "disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

server:
  read_timeout: 60s
  write_timeout: 60s
  idle_timeout: 60s
  shutdown_timeout: 5s

logger:
  level: "info"
  encoding: "json"
  output_paths: ["stdout"]
  error_output_paths: ["stderr"]

cache:
  enabled: false
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: ${JWT_SECRET}
  access_token_ttl: 15m
  refresh_token_ttl: 168h

storage:
  provider: seaweedfs
  seaweedfs:
    master_url: ${SEAWEED_MASTER_URL}
    filer_url: ${SEAWEED_FILER_URL}
    volume_url: ${SEAWEED_VOLUME_URL}
    public_url: ${STORAGE_SEAWEEDFS_PUBLIC_URL:-}

oauth:
  encryption_key: ${OAUTH_ENCRYPTION_KEY}
  cookie_domain: "localhost"
  mobile_redirect_base_url: ${OAUTH_MOBILE_REDIRECT_BASE_URL}
  providers:
    - name: "google"
      client_id: ${GOOGLE_CLIENT_ID}
      client_secret: ${GOOGLE_CLIENT_SECRET}
      redirect_uri: ${OAUTH_GOOGLE_REDIRECT_URI}
      scopes:
        - https://www.googleapis.com/auth/userinfo.email
        - https://www.googleapis.com/auth/userinfo.profile
    - name: "facebook"
      client_id: ${FACEBOOK_CLIENT_ID}
      client_secret: ${FACEBOOK_CLIENT_SECRET}
      redirect_uri: ${OAUTH_FACEBOOK_REDIRECT_URI}
      scopes:
        - email
        - public_profile
rabbitmq:
  enabled: true
  host: ${RABBITMQ_HOST}
  port: 5672
  username: ${RABBITMQ_USERNAME}
  password: ${RABBITMQ_PASSWORD}
  vhost: ${RABBITMQ_VHOST}
  exchange: ${RABBITMQ_EXCHANGE}
  service_name: ${RABBITMQ_SERVICE_NAME}

email:
  enabled: false
  host: "localhost"
  port: 587
  username: ""
  password: ""
  from: "noreply@example.com"
  from_name: ""
  enable_tls: false

chapa:
  enabled: false
  secret_key: ${CHAPA_SECRET_KEY}
  public_key: ${CHAPA_PUBLIC_KEY}
  webhook_secret: ${CHAPA_WEBHOOK_SECRET}
  base_url: ${CHAPA_BASE_URL:-https://api.chapa.co/v1}
  callback_url: ${CHAPA_CALLBACK_URL}
  return_url: ${CHAPA_RETURN_URL}
