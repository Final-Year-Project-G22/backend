app:
  name: "server"
  environment: "local"
  version: "0.1.0"
  port: 4000
  grpc_port: 50052
  debug: true

ai:
  inference_grpc_endpoint: ${AI_INFERENCE_GRPC_ENDPOINT:-localhost:50051}
  inference_auth_token: ${AI_INFERENCE_AUTH_TOKEN:-}
  inference_timeout: 60s
  ask_enabled: ${AI_ASK_ENABLED:-true}
  conversation_cache_ttl: ${AI_CONVERSATION_CACHE_TTL:-5m}

ingestion:
  enabled: ${INGESTION_ENABLED:-true}
  signing:
    active_key_id: ${INGESTION_SIGNING_ACTIVE_KEY_ID:-ingestion-v1}
    active_key_secret: ${INGESTION_SIGNING_ACTIVE_KEY_SECRET:-change-me}
    previous_keys: []
  dispatcher:
    batch_size: ${INGESTION_DISPATCHER_BATCH_SIZE:-50}
    interval: ${INGESTION_DISPATCHER_INTERVAL:-5s}
    retry_base_delay: ${INGESTION_DISPATCHER_RETRY_BASE_DELAY:-30s}
    retry_max_delay: ${INGESTION_DISPATCHER_RETRY_MAX_DELAY:-10m}
    max_attempts_before_dlq: ${INGESTION_DISPATCHER_MAX_ATTEMPTS_BEFORE_DLQ:-10}

database:
  type: "postgres"
  host: "localhost"
  port: 5432
  sslmode: "disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

server:
  read_timeout: 60s
  write_timeout: 60s
  idle_timeout: 60s
  shutdown_timeout: 5s

logger:
  level: "info"
  encoding: "json"
  output_paths: ["stdout"]
  error_output_paths: ["stderr"]

cache:
  enabled: false

jwt:
  secret: ${JWT_SECRET}
  access_token_ttl: 15m
  refresh_token_ttl: 168h

storage:
  provider: seaweedfs
  seaweedfs:
    master_url: ${SEAWEED_MASTER_URL}
    filer_url: ${SEAWEED_FILER_URL}
    volume_url: ${SEAWEED_VOLUME_URL}

oauth:
  encryption_key: ${OAUTH_ENCRYPTION_KEY}
  cookie_domain: "localhost"
  mobile_redirect_base_url: ${OAUTH_MOBILE_REDIRECT_BASE_URL}
  providers:
    - name: "google"
      client_id: ${GOOGLE_CLIENT_ID}
      client_secret: ${GOOGLE_CLIENT_SECRET}
      redirect_uri: ${OAUTH_GOOGLE_REDIRECT_URI}
      scopes:
        - https://www.googleapis.com/auth/userinfo.email
        - https://www.googleapis.com/auth/userinfo.profile
    - name: "facebook"
      client_id: ${FACEBOOK_CLIENT_ID}
      client_secret: ${FACEBOOK_CLIENT_SECRET}
      redirect_uri: ${OAUTH_FACEBOOK_REDIRECT_URI}
      scopes:
        - email
        - public_profile
rabbitmq:
  enabled: ${RABBITMQ_ENABLED}
  host: ${RABBITMQ_HOST}
  port: ${RABBITMQ_PORT}
  username: ${RABBITMQ_USERNAME}
  password: ${RABBITMQ_PASSWORD}
  vhost: ${RABBITMQ_VHOST}
  exchange: ${RABBITMQ_EXCHANGE}
  service_name: ${RABBITMQ_SERVICE_NAME}

email:
  enabled: ${EMAIL_ENABLED}
  host: ${EMAIL_HOST}
  port: ${EMAIL_PORT}
  username: ${EMAIL_USERNAME}
  password: ${EMAIL_PASSWORD}
  from: ${EMAIL_FROM}
  from_name: ${EMAIL_FROM_NAME}
  enable_tls: ${EMAIL_ENABLE_TLS}

chapa:
  enabled: ${CHAPA_ENABLED:-true}
  secret_key: ${CHAPA_SECRET_KEY}
  public_key: ${CHAPA_PUBLIC_KEY}
  webhook_secret: ${CHAPA_WEBHOOK_SECRET}
  base_url: ${CHAPA_BASE_URL:-https://api.chapa.co/v1}
