app:
  name: "server"
  environment: "local"
  version: "0.1.0"
  port: 4000
  debug: true

database:
  type: "postgres"
  host: "localhost"
  port: 5432
  sslmode: "disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

server:
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 5s

logger:
  level: "info"
  encoding: "json"
  output_paths: ["stdout"]
  error_output_paths: ["stderr"]

cache:
  enabled: false

# JWT configuration - secret MUST be overridden via JWT_SECRET env var
# The placeholder below will fail validation (min 32 chars) unless overridden
jwt:
  secret: "change-me-via-JWT_SECRET-env-var"
  access_token_ttl: 15m
  refresh_token_ttl: 168h

storage:
  provider: seaweedfs
  seaweedfs:
    filer_url: ${SEAWEED_FILTER_URL}
    volume_url: ${SEAWEED_VOLUME_URL}
