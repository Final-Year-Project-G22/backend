app:
  name: "server"
  environment: "local"
  version: "0.1.0"
  port: 4000
  debug: true

database:
  type: "postgres"
  host: "localhost"
  port: 5432
  sslmode: "disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

server:
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 5s

logger:
  level: "info"
  encoding: "json"
  output_paths: ["stdout"]
  error_output_paths: ["stderr"]

cache:
  enabled: false

jwt:
  secret: ${JWT_SECRET}
  access_token_ttl: 15m
  refresh_token_ttl: 168h

storage:
  provider: seaweedfs
  seaweedfs:
    master_url: ${SEAWEED_MASTER_URL}
    filer_url: ${SEAWEED_FILER_URL}
    volume_url: ${SEAWEED_VOLUME_URL}

oauth:
  encryption_key: ${OAUTH_ENCRYPTION_KEY}
  cookie_domain: "localhost"
  providers:
    - name: "google"
      client_id: ${GOOGLE_CLIENT_ID}
      client_secret: ${GOOGLE_CLIENT_SECRET}
      redirect_uri: ${OAUTH_GOOGLE_REDIRECT_URI}
      scopes:
        - https://www.googleapis.com/auth/userinfo.email
        - https://www.googleapis.com/auth/userinfo.profile
    - name: "facebook"
      client_id: ${FACEBOOK_CLIENT_ID}
      client_secret: ${FACEBOOK_CLIENT_SECRET}
      redirect_uri: ${OAUTH_FACEBOOK_REDIRECT_URI}
      scopes:
        - email
        - public_profile
