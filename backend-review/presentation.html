  <dialog id="topic-dialog" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title">Review topics</h2><button id="close-dialog" aria-label="Close review topics">Close</button></div><div class="dialog-body" id="dialog-body"></div></dialog>
  <script>
  'use strict';
  const topics = [
    {id:1,title:'Module boundaries',chapter:1,priority:'Design',evidence:'Import inspection',current:'Business modules import repositories of other modules, entities, and application internals.',impact:'Changes to one module can require changes in several other modules.',fix:'Expose small supported operations. Enforce imports into module internals. Shared PostgreSQL can stay.',files:['core-backend/internal/modules/guide/application/usecase/guide_view_usecase.go','core-backend/internal/modules/modules.go']},
    {id:2,title:'The core package',chapter:1,priority:'Design',evidence:'Composition inspection',current:'internal/core combines configuration, HTTP, database, migrations, messaging, and business event wiring.',impact:'A basic dependency can pull in unrelated application concerns.',fix:'Give infrastructure concerns cohesive internal packages. Keep bootstrap responsible for assembly and lifecycle.',files:['core-backend/internal/core/module.go','core-backend/internal/events/subscribers.go']},
    {id:3,title:'Shared code and interfaces',chapter:1,priority:'Design',evidence:'Interface inspection',current:'Shared packages mix authorization, persistence machinery, and business contracts. The generic repository exposes GORM.',impact:'Consumers learn implementation details and receive operations they do not need.',fix:'Use consumer-owned interfaces. Keep generic CRUD helpers inside adapters. Give business contracts an owner.',files:['core-backend/internal/shared/repository/generic_repository.go','core-backend/pkg/middleware/error_handler.go']},
    {id:4,title:'Structs and models',chapter:1,priority:'Design',evidence:'Model inspection',current:'Transport structs are separate, but required timestamps use pointers and persistence base types are duplicated.',impact:'Callers handle avoidable nil states and duplicated database conventions.',fix:'Keep Huma DTOs separate. Prefer values for required fields. Consolidate persistence types after checking NULL semantics.',files:['core-backend/internal/shared/model/base_model.go','core-backend/internal/core/database.go']},
    {id:5,title:'Repository errors',chapter:2,priority:'P2',evidence:'Reproduced with GORM callback injection',current:'List queries log database failures and return an empty page without an error.',impact:'A failed database query can look like a successful empty result.',fix:'Return a page and an error. Propagate both count and fetch failures to the HTTP boundary.',files:['core-backend/internal/shared/repository/base_repository.go']},
    {id:6,title:'Go startup and shutdown',chapter:2,priority:'P2',evidence:'Lifecycle inspection',current:'HTTP startup returns before binding. Some workers use background contexts. Connections and upgraded sockets have incomplete stop ownership.',impact:'Startup may report success without a listener, and shutdown can leave work or connections behind.',fix:'Bind synchronously. Give each resource an owner with cancellation, bounded drain, and close.',files:['core-backend/internal/core/server.go','core-backend/internal/modules/community/module.go','core-backend/internal/modules/coregrpc/module.go']},
    {id:7,title:'Migration execution',chapter:2,priority:'P1',evidence:'Docker and command inspection',current:'The migration service appends the schema command to the API entrypoint. The schema CLI also starts all application modules.',impact:'The migration container starts the API executable, and the CLI depends on unrelated runtime hooks.',fix:'Use the schema executable as the entrypoint and isolate database-only composition. Give production migrations one owner.',files:['core-backend/Dockerfile','docker-compose.prod.yml','core-backend/cmd/schema/main.go']},
    {id:8,title:'Generated API contracts',chapter:1,priority:'Keep',evidence:'Route/spec inspection',current:'Huma DTOs generate OpenAPI, and spec generation reuses route registration. Application/spec composition lists are still separate.',impact:'Generated contracts reduce duplication; separate catalogs can drift.',fix:'Keep generation and consumer type propagation. Share the route catalog and verify operation parity.',files:['core-backend/cmd/spec/main.go','core-backend/internal/core/api.go']},
    {id:9,title:'Production configuration',chapter:2,priority:'P1',evidence:'Checked-in Compose inspection',current:'Go misses the ingestion signing secret and public storage URL. A non-default CORE_PORT mismatches the mapped container port.',impact:'Configured deployments can reject ingestion signatures or return unreachable endpoints.',fix:'Wire the required settings and validate production combinations before starting listeners.',files:['docker-compose.prod.yml','core-backend/internal/configs/config.yml']},
    {id:10,title:'Logging and readiness',chapter:2,priority:'P2',evidence:'Logging inspection',current:'Logger.WithContext is a no-op. GORM messages are forwarded as Info while production logs at Warn.',impact:'Request correlation stops early, and database errors can disappear from production logs.',fix:'Propagate correlation fields through contexts, RPC, and events. Map database severity correctly and measure dependency readiness.',files:['core-backend/internal/core/logger.go','core-backend/internal/core/database.go']},
    {id:11,title:'gRPC authentication',chapter:3,priority:'P1',evidence:'Python handler branch reproduced; Go configuration inspected',current:'Python returns the original streaming handler on failed authentication. Go creates a server without service authentication.',impact:'A caller able to reach the internal network can bypass the intended trust checks.',fix:'Authenticate every RPC shape and authorize user/account context. Add explicit deadlines, transport tests, and channel cleanup.',files:['ai-service/infrastructure/rpc/server.py','core-backend/internal/modules/coregrpc/module.go']},
    {id:12,title:'Events and delivery',chapter:4,priority:'P1',evidence:'Retry behavior reproduced; transaction paths inspected',current:'Go marks publication without broker confirms. Python requeue does not persist attempts, and terminal events precede database commit.',impact:'Events can disappear, retries can loop indefinitely, or completion can disagree with persisted state.',fix:'Use confirmed publication, durable retries and dead letters, outbox claims, reconnection, and a transactional AI terminal-event outbox.',files:['core-backend/pkg/rabbitmq/client.go','ai-service/infrastructure/messagebus/ingestion_consumer.py','ai-service/core/usecases/ingestion_orchestrator.py']},
    {id:13,title:'File storage guarantees',chapter:5,priority:'P1 for private uploads',evidence:'Adapter inspection; external proxy not inspected',current:'SeaweedFS returns bare URLs with expiry metadata. Its download fallback does not enforce expiring authorization.',impact:'The adapter does not provide the same guarantee as MinIO. Python also constructs SeaweedFS URLs directly.',fix:'Provide real signed access or an authenticated gateway. Distinguish public URLs from authorized URLs and inject a document reader.',files:['core-backend/pkg/storage/seaweedfs.go','ai-service/core/usecases/ingestion_orchestrator.py']},
    {id:14,title:'WebSocket identity',chapter:5,priority:'P2',evidence:'Actual hub bookkeeping reproduced',current:'Old connection cleanup unregisters by account ID after a new connection replaces it.',impact:'The replacement is closed and an old subscription can remain.',fix:'Unregister the exact connection. Define multi-device behavior, subscription authorization, resync, replica fanout, and shutdown.',files:['core-backend/internal/ws/hub.go','core-backend/internal/ws/client.go']},
    {id:15,title:'Python dependency direction',chapter:6,priority:'Design',evidence:'Five production outward imports found',current:'Core use cases import infrastructure registries, prefetch implementation, and prompt loading.',impact:'Provider and IO details become part of the use-case implementation.',fix:'Keep pure policy with use cases. Inject document reading and adapter-dependent operations through meaningful ports.',files:['ai-service/core/usecases/ingestion_orchestrator.py','ai-service/core/usecases/strategies/agentic_ask.py']},
    {id:16,title:'Python packaging',chapter:6,priority:'Design',evidence:'Import loader inspection',current:'Application core collides with the generated protobuf core namespace. A loader changes package paths and module state.',impact:'Import behavior depends on startup order and path manipulation.',fix:'Install the application under a distinct namespace such as adisu_ai. Use normal generated imports and package prompt resources.',files:['ai-service/infrastructure/rpc/grpc_stub_loader.py','ai-service/main.py']},

      d+=box(515,134,416,91,'Required preparation',['Check the selected model capabilities','Apply or restart with the new configuration'],state.failed?'risk':'neutral');
    }else{
      d+=box(349,16,249,76,active?`kb-v2 / ${dimension} dimensions`:'kb-v1 / 1024 dimensions',['Resolved active embedding profile'],'ai')+box(691,16,240,76,'Search matching profile',['Query and documents agree'],'ai');
      d+=line(active?'M811 92 V134':'M811 92 V112 H238 V134','',0,0,'ai');
      const labels=['Desired configuration','Provider and profile validated','Replacement embeddings ready','Index and retrieval checks ready','Serving new requests'];
      d+=box(29,134,416,91,'Profile kb-v1',['Model A, 1024 dimensions',active?'Retained for a defined rollback period':'Continues serving during preparation'],active?'neutral':'ai');
      d+=box(515,134,416,91,'Profile kb-v2',[`Model B, ${dimension} dimensions`,state.failed?'Preparation failed; active profile unchanged':labels[state.step]],state.failed?'risk':active?'ai':'neutral');
    }
    const labels=isLLM?['Configured','Validated','Applied']:['Configured','Validated','Embedded','Indexed','Activated'];
    labels.forEach((label,i)=>{const x=75+i*(810/(labels.length-1)),done=i<=state.step&&!state.failed; if(i<labels.length-1)d+=`<path d="M${x+13} 258 H${x+810/(labels.length-1)-13}" stroke="${i<state.step&&!state.failed?'#087565':'#cfd9e6'}" stroke-width="3"/>`;d+=`<circle cx="${x}" cy="258" r="13" fill="${done?'#087565':'#e8eef6'}"/>${text(x,263,String(i+1),12,done?'white':'#52647a',700,'middle')}${text(x,290,label,13,done?'#087565':'#52647a',done?700:400,'middle')}`});
    const stepLabels=isLLM?['Validate capabilities','Apply configuration']:['Validate profile','Re-embed corpus','Prepare index and checks','Activate profile'];
    const embeddingMessages=[
      state.scenario==='same'?'Equal dimensions still require compatible new document embeddings.':'Flexible storage accepts the new dimension. Prepare compatible document embeddings before activation.',
      'Profile validated. Generate replacement vectors from retained chunk text.',
      'Replacement embeddings are ready. Prepare the index and run retrieval checks next.',
      'Index and retrieval checks passed. Activate kb-v2 atomically for new requests.',
      'New queries use kb-v2. Keep kb-v1 available for the rollback period.'
    ];
    const llmMessages=['A supported LLM change does not require a database migration.','Capabilities validated. Apply the selected LLM configuration.','The new LLM is active. The embedding corpus is unchanged.'];
    let status=(isLLM?llmMessages:embeddingMessages)[state.step];
    if(state.failed)status='Preparation failed in this demonstration. Current requests keep using the old selection.';
    const controls=`<div class="simulation-controls"><div class="simulation-step" id="simulation-status" aria-live="polite"><strong class="${state.failed?'failure':''}">${state.failed?'Preparation failed':active?'Switch complete':`Step ${state.step+1} of ${max+1}`}</strong><span>${status}</span></div><button id="model-reset">Reset</button><button id="model-fail" ${active||state.failed?'disabled':''}>Simulate failure</button><button class="primary" id="model-next" ${active?'disabled':''}>${state.failed?'Retry preparation':active?'Activated':stepLabels[state.step]}</button></div>`;
    const buttons=`<div class="scenario-bar" role="group" aria-label="Model change scenario">${[['llm','LLM only'],['same','Embedding: same dimensions'],['different','Embedding: new dimensions']].map(([key,label])=>`<button data-scenario="${key}" aria-pressed="${state.scenario===key}">${label}</button>`).join('')}</div>`;
    return `<div class="diagram-panel"><div class="diagram-top"><strong>Config selects the desired model. Readiness controls activation.</strong><span class="status-tag proposed">Proposed</span></div>${buttons}<div class="diagram-scroll">${svg(d,'Interactive model-switching proposal. The active profile continues serving until validation, embeddings, and indexing complete.',306)}</div>${controls}<p class="diagram-caption">Illustrative states only. These controls explain the proposal; they do not call providers or change the backend.</p></div><div class="callout"><strong>One initial schema redesign for embeddings.</strong> Later supported switches can automate backfills and index creation. Index creation is still DDL; it does not need a hand-written Alembic file each time.</div>`+`<details class="more-context"><summary>Design details and configuration changes</summary>`+notes(note('Give every vector a profile','Store immutable model identity, dimensions, and preprocessing. Always match query and document profiles.','ai'),note('Keep content independent','Store chunk text separately from profile-specific embeddings. Reuse text when changing only the embedding model.','ai'),note('Config must reach the process','Compose currently fixes providers to Cohere. Wire model settings and validate the actual returned dimensions.'))+`</details>`;
  }
  function verification(){
    let d=text(28,25,'Existing checks',15,'#52647a',700);
    d+=line('M275 83 H352','',0,0,'ai')+line('M603 83 H680','',0,0,'ai');
    d+=box(28,43,247,81,'Go test suite',['Passed with installed Go 1.27.1'],'go')+box(352,43,251,81,'Python test suite',['434 passed; 83.75% coverage'],'ai')+box(680,43,252,81,'Python static checks',['Types, Ruff, Bandit passed'],'ai');
    d+=text(28,174,'Add checks around real system boundaries',15,'#52647a',700);
    ['Database transactions','Broker retries','gRPC transport','Migration containers'].forEach((label,i)=>{d+=box(28+i*234,195,219,66,label,[],'amber')});
    return panel('Verification completed, with focused next checks',svg(d,'Existing Go and Python checks passed. Proposed additional checks cover databases, brokers, RPC transport, and deployment commands.',283),'Go is pinned to 1.25.3 in the project and CI. The local passing run used 1.27.1. No live production database, broker, storage, or model endpoint was exercised.','Evidence')+`<table class="check-table"><thead><tr><th>Diagnostic probe</th><th>What it established</th></tr></thead><tbody><tr><td>WebSocket replacement</td><td>Old connection cleanup removes the replacement.</td></tr><tr><td>GORM query failure</td><td>A query error becomes an empty result with no error return.</td></tr><tr><td>Streaming authentication</td><td>A source-level helper returns the unauthorized streaming handler unchanged.</td></tr><tr><td>Retry exhaustion</td><td>Fake deliveries requeue beyond the configured retry limit.</td></tr></tbody></table>`+`<details class="more-context"><summary>Runtime and CI improvements</summary>`+notes(note('Correct the CI gates','Use golangci-lint v2 with the v2 config. Fail formatting differences. Include Python checks for proto-only changes.','risk'),note('Test construction and lifetimes','Python coverage omits <code>main.py</code> and workers. Add real-composition tests for sessions, cleanup, and commit ownership.'),note('Protect the event loop','Move PDF parsing to bounded processes. Use explicit stream variants and dependency-aware readiness.','ai'))+`</details>`;
  }
  function fixOrder(){
    const stages=[['Trust + transactions',['Python session scopes','Atomic quota reservation','gRPC authentication'],'risk'],['Deployment',['Migration executable','DB-only migration graph','Production config'],'go'],['Durable delivery',['Broker confirmations','Persistent retries / DLQ','AI terminal-event outbox'],'go'],['State and access',['Storage authorization','WebSocket identity','Repository error returns'],'ai'],['Config + boundaries',['Embedding profiles','Model preparation jobs','Module contracts'],'ai']];
    let d='';stages.forEach(([title,lines,type],i)=>{const x=20+i*188;if(i<stages.length-1)d+=line(`M${x+172} 140 H${x+188}`,'',0,0,'neutral');d+=text(x+8,37,`Work ${i+1}`,14,'#52647a',700)+box(x,59,172,214,'',[],type)+text(x+12,88,title,14,palette[type].stroke,700);lines.forEach((label,j)=>{const words=label.split(' '),first=words.slice(0,2).join(' '),second=words.slice(2).join(' ');d+=text(x+13,115+j*51,first,13,'#435871');if(second)d+=text(x+13,132+j*51,second,13,'#435871')})});
    d+=`<rect x="20" y="303" width="924" height="51" rx="7" fill="#f3f6fb" stroke="#cfd9e6"/>${text(482,334,'Add a regression test with each fix. Align CI and contract generation throughout.',15,'#17283f',700,'middle')}`;
    return panel('Recommended work sequence',svg(d,'Five work groups prioritize trust, deployment, durable delivery, state and access, then model configuration and module boundaries.',374),'P1 means fix before trusting the affected feature in production. P2 means address next. Design recommendations are separate from reproduced defects.','Proposed')+notes(note('Agree on the model workflow','A config change requests a supported model. A worker prepares compatible data and activates only when ready.','ai'),note('Prove each boundary','Pair the fix with a meaningful failure or concurrency test. Use the passing suites as a baseline.'),note('Keep the review traceable','The topic index maps every diagram to sections 1 through 23. The Markdown files contain file references and full reasoning.'))+`<p class="verification-limit">Review baseline: commit <code>216fc0a94ea86bcd712028c2647b36f2e11e0c77</code>, 25 September 2026. Recommended designs are proposals, not implemented changes.</p>`;
  }
  function renderContent(index){const proposed=state.views[index]==='recommended';return [systemMap,()=>goModules(proposed),()=>goLifecycle(proposed),()=>grpcDiagram(proposed),()=>eventsDiagram(proposed),()=>filesSockets(proposed),()=>pythonLifetimes(proposed),modelDiagram,verification,fixOrder][index]()}
  function chapterMarkup(index){const chapter=chapters[index],recommended=state.views[index]==='recommended';return `<div class="slide-heading"><div><div class="section-ref">${chapter.refs.length?'Review sections '+chapter.refs.join(', '):index===0?'Architecture and evidence':'Recommended work sequence'}</div><h1 tabindex="-1">${chapter.title}</h1><p>${chapter.intro}</p></div>${chapter.toggle?`<div class="view-switch" role="group" aria-label="Diagram view"><button data-view="current" data-for="${index}" aria-pressed="${!recommended}">Current</button><button data-view="recommended" data-for="${index}" aria-pressed="${recommended}">Recommended</button></div>`:''}</div>${renderContent(index)}${chapter.refs.length?`<div class="topic-strip" aria-label="Read findings for this chapter">${chapter.refs.map(id=>`<button data-topic="${id}">${id}. ${topics[id-1].title}</button>`).join('')}</div>`:''}<p class="print-only">Adisu backend review. Chapter ${index+1} of ${chapters.length}. Reviewed 25 September 2026. ${chapter.refs.length?'Sections '+chapter.refs.join(', ')+'.':''}</p>`}
  function renderChapter(index,focusSelector){document.getElementById('chapter-'+chapters[index].slug).innerHTML=chapterMarkup(index);if(focusSelector)document.querySelector(focusSelector)?.focus({preventScroll:true})}
  function navigate(index,focus=false){if(index<0||index>=chapters.length)return;state.chapter=index;document.querySelectorAll('.slide').forEach((slide,i)=>slide.hidden=i!==index);document.querySelectorAll('[data-chapter]').forEach((button,i)=>{if(i===index)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});document.getElementById('previous-button').disabled=index===0;document.getElementById('next-button').disabled=index===chapters.length-1;document.getElementById('slide-counter').textContent=`${index+1} / ${chapters.length}`;document.getElementById('chapter-label').textContent=chapters[index].nav;document.getElementById('progress').style.width=((index+1)/chapters.length*100)+'%';document.getElementById('content').scrollTop=0;document.getElementById('sidebar').classList.remove('open');document.getElementById('menu-button').setAttribute('aria-expanded','false');history.replaceState(null,'','#'+chapters[index].slug);document.title=`${chapters[index].nav} | Adisu backend review`;if(focus)document.querySelector('.slide:not([hidden]) h1')?.focus({preventScroll:true})}
  const dialog=document.getElementById('topic-dialog');
  function showIndex(){document.getElementById('dialog-title').textContent='All 23 review topics';document.getElementById('dialog-body').innerHTML=`<p style="margin:0 0 17px;color:var(--muted);font-size:14px">Select a topic for the finding, consequence, recommendation, and source files.</p><div class="topic-index">${topics.map(topic=>`<button data-topic="${topic.id}"><span class="topic-number">${topic.id}</span><span><strong>${escapeHTML(topic.title)}</strong><small>${escapeHTML(topic.priority)} / ${escapeHTML(chapters[topic.chapter].nav)}</small></span></button>`).join('')}</div>`;if(!dialog.open)dialog.showModal();document.getElementById('close-dialog').focus()}
  function showTopic(id){const topic=topics.find(item=>item.id===id);if(!topic)return;document.getElementById('dialog-title').textContent=`Review section ${id}`;document.getElementById('dialog-body').innerHTML=`<article class="topic-detail"><div class="detail-status"><span class="status-tag ${topic.priority.startsWith('P1')?'risk':''}">${escapeHTML(topic.priority)}</span><span>${escapeHTML(topic.evidence)}</span></div><h2 class="detail-title">${escapeHTML(topic.title)}</h2><h3>Observed</h3><p>${escapeHTML(topic.current)}</p><h3>Consequence</h3><p>${escapeHTML(topic.impact)}</p><h3>Recommendation</h3><p>${escapeHTML(topic.fix)}</p><h3>Source files in the reviewed repository</h3><pre>${topic.files.map(escapeHTML).join('\n')}</pre><div class="detail-actions"><button data-topic-index>All topics</button><button class="primary" data-show-diagram="${topic.chapter}">Show diagram</button></div></article>`;if(!dialog.open)dialog.showModal();dialog.scrollTop=0;document.getElementById('close-dialog').focus()}
  function setPresentation(value){state.presenting=value;document.body.classList.toggle('presenting',value);document.getElementById('present-button').textContent=value?'Exit presentation':'Present';document.getElementById('present-button').setAttribute('aria-pressed',String(value))}
  async function togglePresentation(){const next=!state.presenting;setPresentation(next);try{if(next&&!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(!next&&document.fullscreenElement)await document.exitFullscreen()}catch{/* Expanded layout remains usable when full-screen is unavailable. */}}
  document.getElementById('chapter-nav').innerHTML=chapters.map((chapter,index)=>`<button data-chapter="${index}"><span>${chapter.nav}</span><small>${chapter.refs.length?'Sections '+chapter.refs.join(', '):index===0?'Services and their connections':'Priorities and acceptance'}</small></button>`).join('');
  document.getElementById('slides').innerHTML=chapters.map((chapter,index)=>`<section class="slide" id="chapter-${chapter.slug}" ${index?'hidden':''} aria-label="${escapeHTML(chapter.nav)}">${chapterMarkup(index)}</section>`).join('');
  document.addEventListener('click',event=>{
    if(!(event.target instanceof Element))return;
    const button=event.target.closest('button');
    if(button){
      if(button.hasAttribute('data-chapter'))navigate(Number(button.dataset.chapter),true);
      else if(button.hasAttribute('data-view')){const index=Number(button.dataset.for);state.views[index]=button.dataset.view;renderChapter(index,`#chapter-${chapters[index].slug} [data-view="${button.dataset.view}"]`)}
      else if(button.hasAttribute('data-topic'))showTopic(Number(button.dataset.topic));
      else if(button.hasAttribute('data-topic-index'))showIndex();
      else if(button.hasAttribute('data-show-diagram')){dialog.close();navigate(Number(button.dataset.showDiagram),true)}
      else if(button.hasAttribute('data-scenario')){state.scenario=button.dataset.scenario;state.step=0;state.failed=false;renderChapter(7,`[data-scenario="${state.scenario}"]`)}
      else if(button.id==='model-next'){if(state.failed)state.failed=false;else state.step=Math.min(state.step+1,state.scenario==='llm'?2:4);renderChapter(7,state.step===(state.scenario==='llm'?2:4)?'#model-reset':'#model-next')}
      else if(button.id==='model-reset'){state.step=0;state.failed=false;renderChapter(7,'#model-reset')}
      else if(button.id==='model-fail'){state.failed=true;renderChapter(7,'#model-next')}
    }
    const anchor=event.target.closest('a[href^="#"]');
    if(anchor){const index=chapters.findIndex(chapter=>chapter.slug===anchor.getAttribute('href').slice(1));if(index>=0){event.preventDefault();navigate(index,true)}}
  });
  document.getElementById('previous-button').addEventListener('click',()=>navigate(state.chapter-1,true));
  document.getElementById('next-button').addEventListener('click',()=>navigate(state.chapter+1,true));
  document.getElementById('topics-button').addEventListener('click',showIndex);
  document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());
  document.getElementById('print-button').addEventListener('click',()=>window.print());
  document.getElementById('present-button').addEventListener('click',togglePresentation);
  document.getElementById('menu-button').addEventListener('click',()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('menu-button').setAttribute('aria-expanded',String(open))});
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&state.presenting)setPresentation(false)});
  document.addEventListener('keydown',event=>{if(dialog.open||event.altKey||event.ctrlKey||event.metaKey||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.target.isContentEditable)return;if(['ArrowRight','PageDown'].includes(event.key)){event.preventDefault();navigate(state.chapter+1,true)}else if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();navigate(state.chapter-1,true)}else if(event.key==='Home'){event.preventDefault();navigate(0,true)}else if(event.key==='End'){event.preventDefault();navigate(chapters.length-1,true)}else if(event.key.toLowerCase()==='f'){event.preventDefault();togglePresentation()}else if(event.key==='Escape'&&state.presenting){setPresentation(false)}});
  window.addEventListener('hashchange',()=>{const index=chapters.findIndex(chapter=>chapter.slug===location.hash.slice(1));if(index>=0)navigate(index,true)});
  let printDetails=[];
  window.addEventListener('beforeprint',()=>{printDetails=[...document.querySelectorAll('details')].map(element=>[element,element.open]);printDetails.forEach(([element])=>element.open=true)});
  window.addEventListener('afterprint',()=>printDetails.forEach(([element,open])=>element.open=open));
  const initial=chapters.findIndex(chapter=>chapter.slug===location.hash.slice(1));navigate(initial>=0?initial:0);
  </script>
</body>
