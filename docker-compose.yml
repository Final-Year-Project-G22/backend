services:
  # Database
  postgres:
    image: postgres:18-alpine
    container_name: adisu_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DBNAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DBNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache
  redis:
    image: redis:8-alpine
    container_name: adisu_cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # File Storage (SeaweedFS)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: adisu_filestorage
    ports:
      - "9333:9333" # Master server
      - "8080:8080" # Volume server
    command: "master -mdir=/data/master -defaultReplication=001 -volumeSizeLimitMB=1024 && volume -dir=/data/volume -max=5 -mserver=localhost:9333"
    volumes:
      - seaweedfs_data:/data

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
