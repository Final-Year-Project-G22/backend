services:
  # Database
  postgres:
    image: postgres:18-alpine
    container_name: adisu_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DBNAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DBNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Database (pgvector-enabled)
  postgres-ai:
    image: pgvector/pgvector:pg18
    container_name: adisu_ai_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: adisu_ai
    volumes:
      - postgres_ai_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d adisu_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache
  redis:
    image: redis:8-alpine
    container_name: adisu_cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: adisu_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # SeaweedFS Master
  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: adisu_seaweed_master
    command: "master -ip=seaweed-master -mdir=/data/master -defaultReplication=000 -volumeSizeLimitMB=1024"
    ports:
      - "9333:9333"
    volumes:
      - seaweed_master_data:/data/master
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # SeaweedFS Volume
  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: adisu_seaweed_volume
    command: "volume -ip=seaweed-volume -dir=/data/volume -max=5 -mserver=seaweed-master:9333 -port=8080"
    depends_on:
      seaweed-master:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - seaweed_volume_data:/data/volume

  # SeaweedFS Filer (required for /dir/assign used by app upload flow)
  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: adisu_seaweed_filer
    command: "filer -ip=seaweed-filer -master=seaweed-master:9333"
    depends_on:
      seaweed-master:
        condition: service_started
      seaweed-volume:
        condition: service_started
    ports:
      - "8888:8888"
    volumes:
      - seaweed_filer_data:/data/filer
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  postgres_ai_data:
  redis_data:
  seaweed_master_data:
  seaweed_volume_data:
  seaweed_filer_data:
  rabbitmq_data:
