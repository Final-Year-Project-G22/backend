default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Go (core-backend)
  - repo: local
    hooks:
      - id: go-lint
        name: Go Linting
        entry: bash -c 'cd core-backend && golangci-lint run ./... --skip-dirs pb'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-fmt
        name: Go Formatting (goimports)
        entry: bash -c 'git ls-files "core-backend/*.go" "core-backend/**/*.go" ":!:core-backend/pb/**" | xargs -r goimports -l -w'
        language: system
        types: [go]
        pass_filenames: false

  # Python (ai-service)
  - repo: local
    hooks:
      - id: python-ruff
        name: Python Linting (ruff)
        entry: bash -c 'cd ai-service && uv run ruff check .'
        language: system
        types: [python]
        pass_filenames: false
        exclude: ^ai-service/grpc_stubs/

      - id: python-format
        name: Python Formatting (ruff)
        entry: bash -c 'cd ai-service && uv run ruff format .'
        language: system
        types: [python]
        pass_filenames: false
        exclude: ^ai-service/grpc_stubs/

  # Python - Type Checking (ai-service only)
  - repo: local
    hooks:
      - id: python-typecheck
        name: Python Type Checking (basedpyright)
        entry: bash -c 'cd ai-service && uv run basedpyright'
        language: system
        types: [python]
        files: ^ai-service/.*\.py$
        exclude: ^ai-service/grpc_stubs/
        pass_filenames: false

  # Python - Security (ai-service only)
  - repo: local
    hooks:
      - id: python-security
        name: Python Security Scan (bandit)
        entry: bash -c 'cd ai-service && uv run bandit -c pyproject.toml -r app core infrastructure workers'
        language: system
        types: [python]
        files: ^ai-service/.*\.py$
        exclude: ^ai-service/grpc_stubs/
        pass_filenames: false

  # Commit Message
  - repo: local
    hooks:
      - id: commitlint
        name: Commit Message Linting
        entry: npx commitlint --edit
        language: system
        stages: [commit-msg]
