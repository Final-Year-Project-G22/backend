name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: true
          cache-dependency-path: core-backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: core-backend
          args: ./...

  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: true
          cache-dependency-path: core-backend/go.sum

      - name: Run Go tests
        run: cd core-backend && go test ./...

  python-lint-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Determine changed files
        id: diff
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: Lint Python (changed files)
        run: |
          PY_FILES=$(grep '^ai-service/.*\.py$' /tmp/changed_files.txt | grep -v '^ai-service/grpc_stubs/' || true)
          if [ -z "$PY_FILES" ]; then
            echo "No Python files changed"
            exit 0
          fi
          cd ai-service
          echo "$PY_FILES" | sed 's|^ai-service/||' | xargs uvx ruff check

      - name: Format Python (check only)
        run: |
          PY_FILES=$(grep '^ai-service/.*\.py$' /tmp/changed_files.txt | grep -v '^ai-service/grpc_stubs/' || true)
          if [ -z "$PY_FILES" ]; then
            echo "No Python files changed"
            exit 0
          fi
          cd ai-service
          echo "$PY_FILES" | sed 's|^ai-service/||' | xargs uvx ruff format --check

  python-typecheck-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Determine changed files
        id: diff
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: Generate protobuf stubs
        run: |
          cd proto
          buf generate

      - name: Type check Python (ai-service)
        run: |
          PY_FILES=$(grep '^ai-service/.*\.py$' /tmp/changed_files.txt | grep -v '^ai-service/grpc_stubs/' || true)
          if [ -z "$PY_FILES" ]; then
            echo "No ai-service Python files changed"
            exit 0
          fi
          (cd ai-service && uv sync --frozen --all-groups --extra dev && uv run basedpyright)

      - name: Security scan Python (ai-service)
        run: |
          PY_FILES=$(grep '^ai-service/.*\.py$' /tmp/changed_files.txt | grep -v '^ai-service/grpc_stubs/' || true)
          if [ -z "$PY_FILES" ]; then
            echo "No ai-service Python files changed"
            exit 0
          fi
          (cd ai-service && uv sync --frozen --all-groups --extra dev && uv run bandit -c pyproject.toml -r app core infrastructure workers)
