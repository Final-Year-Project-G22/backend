            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: Generate protobuf stubs
        run: |
          cd proto
          buf generate

