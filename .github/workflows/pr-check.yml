        run: |
          GO_FILES=$(grep '^core-backend/.*\.go$' /tmp/changed_files.txt | grep -v '^core-backend/pb/' || true)
          if [ -z "$GO_FILES" ]; then
            echo "No Go files changed"
            exit 0
          fi
