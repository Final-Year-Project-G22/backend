name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: false

      - name: Cache Go build and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('core-backend/go.sum') }}-1.25.3
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('core-backend/.golangci.yml') }}-1.25.3
          restore-keys: |
            ${{ runner.os }}-golangci-lint-

      - name: Install tooling
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.2
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Determine changed files
        id: diff
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: Lint Go
        run: |
          GO_FILES=$(grep -E '^core-backend/.*\.go$' /tmp/changed_files.txt || true)

          if [ -z "$GO_FILES" ]; then
            echo "No Go files changed"
            exit 0
          fi

          cd core-backend

          DIRS=$(printf '%s\n' "$GO_FILES" \
            | sed 's|^core-backend/||' \
            | xargs -n1 dirname \
            | sort -u)

          echo "Changed Go dirs:"
          echo "$DIRS"

          golangci-lint run $DIRS

      - name: Format Go (check only)
        run: |
          GO_FILES=$(grep -E '^core-backend/.*\.go$' /tmp/changed_files.txt || true)

          if [ -z "$GO_FILES" ]; then
            echo "No Go files changed"
            exit 0
          fi

          cd core-backend
          printf '%s\n' "$GO_FILES" \
            | sed 's|^core-backend/||' \
            | xargs goimports -l

  go-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: false

      - name: Cache Go build and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('core-backend/go.sum') }}-1.25.3
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Determine changed files
        id: diff
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: Run Go tests
        run: |
          GO_CHANGED=$(grep -E '^core-backend/.*\.go$|^core-backend/go\.(mod|sum)$' /tmp/changed_files.txt || true)

          if [ -z "$GO_CHANGED" ]; then
            echo "No Go files changed"
            exit 0
          fi

          cd core-backend
          go test ./...

  openapi-fresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: false

      - name: Cache Go build and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('core-backend/go.sum') }}-1.25.3
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Determine changed files
        id: diff
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: Regenerate spec and check for drift
        run: |
          GO_CHANGED=$(grep -E '^core-backend/.*\.go$' /tmp/changed_files.txt || true)

          if [ -z "$GO_CHANGED" ]; then
            echo "No Go files changed — spec check skipped"
            exit 0
          fi

          cd core-backend
          go run ./cmd/spec
          cd ..
          if ! git diff --quiet -- core-backend/docs/openapi.json; then
            echo "❌ OpenAPI spec is stale. Run 'make spec' in the backend repo and commit core-backend/docs/openapi.json together with your API change."
            git diff --stat -- core-backend/docs/openapi.json
            exit 1
          fi
          echo "✅ OpenAPI spec is up to date"
  python-lint-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('ai-service/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Determine changed files
        id: diff
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: Lint Python
        run: |
          PY_FILES=$(grep -E '^ai-service/.*\.py$' /tmp/changed_files.txt | grep -v '^ai-service/grpc_stubs/' || true)

          if [ -z "$PY_FILES" ]; then
            echo "No Python files changed"
            exit 0
          fi

          cd ai-service
          printf '%s\n' "$PY_FILES" | sed 's|^ai-service/||' | xargs uvx ruff check

      - name: Format Python (check only)
        run: |
          PY_FILES=$(grep -E '^ai-service/.*\.py$' /tmp/changed_files.txt | grep -v '^ai-service/grpc_stubs/' || true)

          if [ -z "$PY_FILES" ]; then
            echo "No Python files changed"
            exit 0
          fi

          cd ai-service
          printf '%s\n' "$PY_FILES" | sed 's|^ai-service/||' | xargs uvx ruff format --check

  python-typecheck-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('ai-service/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Determine changed files
        id: diff
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

      - name: Generate protobuf stubs
        run: |
          if grep -qE '^proto/.*\.proto$|^proto/buf\.gen\.yaml$|^proto/buf\.yaml$' /tmp/changed_files.txt; then
            cd proto
            buf generate
          else
            echo "No proto changes"
          fi

      - name: Type check Python
        run: |
          PY_RELEVANT=$(grep -E '^ai-service/.*\.py$|^ai-service/pyproject\.toml$|^ai-service/uv\.lock$' /tmp/changed_files.txt | grep -v '^ai-service/grpc_stubs/' || true)

          if [ -z "$PY_RELEVANT" ]; then
            echo "No Python files changed"
            exit 0
          fi

          cd ai-service
          uv sync --frozen --all-groups --extra dev
          uv run basedpyright

      - name: Security scan Python
        run: |
          PY_RELEVANT=$(grep -E '^ai-service/.*\.py$|^ai-service/pyproject\.toml$|^ai-service/uv\.lock$' /tmp/changed_files.txt | grep -v '^ai-service/grpc_stubs/' || true)

          if [ -z "$PY_RELEVANT" ]; then
            echo "No Python files changed"
            exit 0
          fi

          cd ai-service
          uv sync --frozen --all-groups --extra dev
          uv run bandit -c pyproject.toml -r app core grpc infrastructure workers
