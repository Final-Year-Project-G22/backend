name: Deploy Prod

on:
  release:
    types: [published]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse release tag
        id: parse
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" == core-backend-v* ]]; then
            echo "service=core-backend" >> $GITHUB_OUTPUT
            echo "version=${TAG#core-backend-}" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == ai-service-v* ]]; then
            echo "service=ai-service" >> $GITHUB_OUTPUT
            echo "version=${TAG#ai-service-}" >> $GITHUB_OUTPUT
          else
            echo "Unknown release tag: $TAG"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Generate proto stubs
        if: steps.parse.outputs.service == 'ai-service'
        run: |
          cd proto
          buf generate

      - name: Build and push ${{ steps.parse.outputs.service }}
        run: |
          bash scripts/deploy.sh ${{ steps.parse.outputs.service }} ${{ steps.parse.outputs.version }} push
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Trigger Dokploy deploy
        run: |
          bash scripts/deploy.sh . ${{ secrets.DOKPLOY_COMPOSE_ID_PROD }} deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
